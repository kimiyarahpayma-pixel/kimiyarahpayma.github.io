<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Works — Kimiya Rahpayma</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">

<style>

* {

  box-sizing: border-box;

}



body {

  margin: 0;

  background: #0d0b0b;

  color: #eee8e2;

  font-family: Arial, Helvetica, sans-serif;

}



header {

  padding: 28px 34px;

  display: flex;

  justify-content: space-between;

  align-items: center;

}



.name {

  font-size: 14px;

  letter-spacing: 0.08em;

  font-weight: bold;

}



nav a {

  color: #eee8e2;

  text-decoration: none;

  font-size: 12px;

  letter-spacing: 0.12em;

  margin-left: 28px;

}



nav a:hover {

  opacity: 0.5;

}



main {

  padding: 70px 34px 120px;

  max-width: 1200px;

  margin: auto;

}



h1 {

  font-family: "Cormorant Garamond", serif;

  font-size: clamp(48px, 8vw, 100px);

  line-height: 0.85;

  margin: 0 0 120px;

  font-weight: 400;

  letter-spacing: -0.04em;

}



.work {

  margin-bottom: 190px;

}



/* Gallery */



.gallery {

  width: 100%;

  position: relative;

  display: flex;

  justify-content: center;

  align-items: center;

  margin-top: 40px;

  padding: 0 55px;

}



.gallery-image {
width: 100%;
max-width: 900px;
height: 72vh;
object-fit: contain;
display: block;
margin: auto;
transition: opacity 0.3s ease;
}



.gallery-arrow {

  position: absolute;

  top: 50%;

  transform: translateY(-50%);

  background: none;

  border: none;

  color: #eee8e2;

  font-family: "Cormorant Garamond", serif;

  font-size: 32px;

  font-weight: 300;

  cursor: pointer;

  opacity: 0.65;

  transition: opacity 0.3s ease;

  z-index: 2;

  padding: 10px;

}



.gallery-arrow:hover {

  opacity: 1;

}



.gallery-arrow.prev {

  left: 0;

}



.gallery-arrow.next {

  right: 0;

}



.gallery-counter {

  position: absolute;

  bottom: -35px;

  width: 100%;

  text-align: center;

  font-family: "Cormorant Garamond", serif;

  font-size: 14px;

  letter-spacing: 2px;

  color: #c9bdb4;

  opacity: 0.7;

}

.gallery-thumbnails {
position: absolute;
bottom: -100px;
display: flex;
justify-content: center;
gap: 12px;
width: 100%;
}

.gallery-thumb {
width: 55px;
height: 55px;
object-fit: cover;
cursor: pointer;
opacity: 0.45;
transition: opacity 0.3s ease, border 0.3s ease;
border: 1px solid transparent;
}

.gallery-thumb:hover {
opacity: 0.85;
}

.gallery-thumb.active {
opacity: 1;
border: 1px solid #c9bdb4;
}

/* Artwork information */



.work-info {

  display: flex;

  justify-content: space-between;

  align-items: flex-start;

  margin-top: 70px;

  gap: 30px;

}



.work-title {

  font-family: "Cormorant Garamond", serif;

  font-size: 26px;

  font-weight: 400;

  font-style: italic;

  letter-spacing: 0.01em;

}



.work-details {

  font-size: 10px;

  line-height: 1.7;

  text-align: right;

  letter-spacing: 0.12em;

  text-transform: uppercase;

  opacity: 0.65;

}



footer {

  padding: 40px 34px;

  font-size: 11px;

  letter-spacing: 0.08em;

}



/* Mobile */



@media (max-width: 700px) {



  header {

    padding: 22px 20px;

  }



  nav a {

    margin-left: 15px;

  }



  main {

    padding: 50px 20px 80px;

  }



  h1 {

    margin-bottom: 60px;

  }



  .gallery {
padding: 0 35px;
margin-top: 20px;
margin-bottom: 120px;
}



  .gallery-image {

    width: 100%;

    height: 48vh;

    max-width: none;

  }



  .gallery-arrow {

    font-size: 27px;

    padding: 5px;

  }



  .gallery-arrow.prev {

    left: 0;

  }



  .gallery-arrow.next {

    right: 0;

  }



  .gallery-counter {
bottom: -35px;
font-size: 12px;
}

.gallery-thumbnails {
bottom: -100px;
gap: 8px;
}

.gallery-thumb {
width: 42px;
height: 42px;
}


  .work-info {

    display: block;

    margin-top: 60px;

  }



  .work-details {

    text-align: left;

    margin-top: 8px;

  }



  .work {

    margin-bottom: 90px;

  }



}
/* After Dark */
.after-dark {
margin-top: 160px;
}

.after-dark-title {
font-family: "Cormorant Garamond", serif;
font-size: 24px;
font-style: italic;
color: #c9bdb4;
margin-bottom: 45px;
opacity: 0.8;
}

.after-dark-gallery {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 35px 25px;
}

.after-dark-gallery img {
width: 100%;
height: auto;
display: block;
}

/* Mobile */
@media (max-width: 700px) {
.after-dark {
margin-top: 110px;
}

.after-dark-title {
font-size: 22px;
margin-bottom: 28px;
}

.after-dark-gallery {
gap: 18px 12px;
}
}
</style>

</head>

<body>

<header>

  <div class="name">KIMIYA RAHPAYMA</div>

  <nav>

    <a href="index.html">HOME</a>

    <a href="Works.html">WORKS</a>

  </nav>

</header>

<main>

  <h1>WORKS</h1>

  <section class="work">



<div class="gallery">



  <button class="gallery-arrow prev" onclick="changeImage(-1)" aria-label="Previous image">&#8592;</button>



  <img class="gallery-image" src="./IMG_6918.jpg" id="galleryImage" alt="My Wandering Head">



  <button class="gallery-arrow next" onclick="changeImage(1)" aria-label="Next image">&#8594;</button>



  <div class="gallery-counter" id="galleryCounter">01 / 08</div>
<div class="gallery-thumbnails" id="galleryThumbnails"></div>


</div>



<div class="work-info">



  <div class="work-title" style="color: #8B1111;">

    My Wandering Head

  </div>



  <div class="work-details">

    2025<br>

    Sculpture

  </div>



</div>
<div class="after-dark">
<div class="after-dark-title">After Dark</div>

<div class="after-dark-gallery">
<img src="./IMG_2624.jpeg" alt="My Wandering Head — illuminated">
<img src="./IMG_2625.jpeg" alt="My Wandering Head — illuminated">
<img src="./IMG_2626.jpeg" alt="My Wandering Head — illuminated">
<img src="./IMG_2627.jpeg" alt="My Wandering Head — illuminated">
<img src="./IMG_2628.jpeg" alt="My Wandering Head — illuminated">
<img src="./IMG_2629.jpeg" alt="My Wandering Head — illuminated">
</div>
</div>
  </section>

</main>

<footer>

  © Kimiya Rahpayma

</footer>

<script>
const galleryImages = [
"./IMG_6918.jpg",
"./IMG_1903.jpeg",
"./unnamed.jpg",
"./wand-left-side.jpg",
"./IMG_2620.jpg",
"./IMG_2621.jpg",
"./IMG_2622.jpg",
"./IMG_2623.jpg"
];
let currentImage = 0;

const mainImage = document.getElementById("galleryImage");
const counter = document.getElementById("galleryCounter");
const thumbnailContainer = document.getElementById("galleryThumbnails");

function showImage(index) {
currentImage = (index + galleryImages.length) % galleryImages.length;

mainImage.style.opacity = 0;

setTimeout(() => {
mainImage.src = galleryImages[currentImage];
mainImage.style.opacity = 1;

counter.textContent =
String(currentImage + 1).padStart(2, "0") + " / " +
String(galleryImages.length).padStart(2, "0");

updateThumbnails();
}, 150);
}

function changeImage(direction) {
showImage(currentImage + direction);
}

function updateThumbnails() {
thumbnailContainer.innerHTML = "";

galleryImages.forEach((src, index) => {
const thumb = document.createElement("img");

thumb.src = src;
thumb.className = "gallery-thumb";
thumb.alt = "View " + (index + 1);

if (index === currentImage) {
thumb.classList.add("active");
}

thumb.onclick = () => showImage(index);

thumbnailContainer.appendChild(thumb);
});
}

updateThumbnails();
</script>

</body>

</html>

:::
