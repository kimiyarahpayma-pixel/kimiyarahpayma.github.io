  <div class="gallery">

<button class="gallery-arrow prev" onclick="changeImage(-1)">&#8592;</button>

<img class="gallery-image" src="./IMG_6918.jpg" id="galleryImage" alt="My Wandering Head">

<button class="gallery-arrow next" onclick="changeImage(1)">&#8594;</button>

</head>
<script>
const galleryImages = [
"./IMG_6918.jpg",
"./IMG_1903.jpeg",
"./unnamed.jpg",
"./wand-left-side.jpg",
"./IMG_2620.jpg",
"./IMG_2621.jpg"
];

let currentImage = 0;

function changeImage(direction) {
currentImage = (currentImage + direction + galleryImages.length) % galleryImages.length;

const image = document.getElementById("galleryImage");
const counter = document.getElementById("galleryCounter");

image.style.opacity = 0;

setTimeout(() => {
image.src = galleryImages[currentImage];
image.style.opacity = 1;
counter.textContent =
String(currentImage + 1).padStart(2, "0") + " / " +
String(galleryImages.length).padStart(2, "0");
}, 150);
}
</script>
